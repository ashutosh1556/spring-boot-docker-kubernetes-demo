# Kubernetes Deployment for PostgreSQL Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: spring-demo
spec:
  replicas: 1  # Single instance for database
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        # Load all environment variables from Secret
        envFrom:
        - secretRef:
            name: postgres-secret
