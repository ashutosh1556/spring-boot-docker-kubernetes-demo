version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: studentsDB
      POSTGRES_USER: ashutver
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spring-postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashutver -d studentsDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-app:
    image: ashutver/spring-demo:v3
    container_name: spring-boot-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studentsDB
      SPRING_DATASOURCE_USERNAME: ashutver
      SPRING_DATASOURCE_PASSWORD: postgres123
    ports:
      - "8080:8080"
    networks:
      - spring-postgres-network

networks:
  spring-postgres-network:
    driver: bridge

volumes:
  postgres-data:
