spring.application.name=learningSpringBootApp
#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/studentsDB
spring.datasource.username=dbuser
spring.datasource.password=
# This will drop and recreate schema on application startup
spring.jpa.hibernate.ddl-auto=update
# To see all the sql statements run by hibernate
spring.jpa.show-sql=true
# Queries will get formatted i.e. become human readable
spring.jpa.properties.hibernate.format_sql=true
# Use 1-based page indexing
spring.data.web.pageable.one-indexed-parameters=true

# Kubernetes health probes
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
